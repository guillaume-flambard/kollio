[project]
name = "kollio-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "langfuse>=4.15.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "litellm>=1.100.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.14.0",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.0.52",
    "taskiq>=0.12.6",
    "taskiq-redis>=1.2.3",
]

[dependency-groups]
dev = [
    "deepeval>=4.2.2",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
    "vcrpy>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires Postgres and Redis",
    "e2e: exercises the complete local runtime across process boundaries",
    "performance: guards latency and query-count budgets on critical paths",
    "live: requires configured external providers",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
files = [
    "src/modules/ideas/domain",
    "src/modules/iterations/domain",
    "src/modules/constraint_analysis/domain",
    "src/modules/challenge/domain",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
