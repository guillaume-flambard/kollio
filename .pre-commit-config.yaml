repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --project apps/api ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --project apps/api ruff format --check
        language: system
        types: [python]
      - id: translation-parity
        name: FR/EN translation parity
        entry: node scripts/check_locales.mjs
        language: system
        pass_filenames: false
        files: 'locales/.*\.json$'
      - id: private-files
        name: Keep private files out of Git
        entry: python3 scripts/check_private_files.py
        language: system
        always_run: true
        pass_filenames: false
