model_list:
  - model_name: kollio-default
    litellm_params:
      model: openai/qwen3.8-flash
      api_base: https://api.b.ai/v1
      api_key: os.environ/BAI_API_KEY
      max_budget: 1
      budget_duration: 1d
      rpm: 30
      tpm: 60000
    model_info:
      input_cost_per_token: 0.00000016
      output_cost_per_token: 0.00000047
      cache_creation_input_token_cost: 0.00000020
      cache_read_input_token_cost: 0.000000016
  - model_name: kollio-embedding
    litellm_params:
      model: openai/text-embedding-3-large
      api_key: os.environ/OPENAI_API_KEY
litellm_settings:
  request_timeout: 60
  num_retries: 1
  set_verbose: false
  turn_off_message_logging: true
  success_callback:
    - langfuse
  failure_callback:
    - langfuse
  max_budget: 1
  budget_duration: 1d
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
